# Endpoints verified 2026-10-24. Optional per-source fields:
#   keywords: replaces the global relevance gate ([] disables it)
#   minScore: engagement floor (points / upvotes), tier 3 only
#   maxItemsPerRun: keep only the newest N entries
#   collapse: day   merges a day's entries into one item (releases, commits)

- id: claude-code-releases
  name: Claude Code releases
  tier: 1
  adapter: feed
  url: https://github.com/anthropics/claude-code/releases.atom
  collapse: day

# The feed exists but its newest item is Week 37 (15 Sep); kept because it costs one request.
- id: claude-code-whats-new
  name: Claude Code what's new
  tier: 1
  adapter: feed
  url: https://code.claude.com/docs/en/whats-new/rss.xml

# No feed. Engineering articles now live under /research/, which also holds papers, so only
# the links on this index count.
- id: anthropic-engineering
  name: Anthropic engineering
  tier: 1
  adapter: html-index
  url: https://www.anthropic.com/engineering
  linkPattern: ^/research/[^/]+$

- id: anthropic-news
  name: Anthropic news
  tier: 1
  adapter: html-index
  url: https://www.anthropic.com/news
  linkPattern: ^/news/[^/]+$
  keywords: [claude code, claude, model, developer, developers, api, sdk, agent, agents, mcp]

- id: claude-blog
  name: Claude blog
  tier: 1
  adapter: html-index
  url: https://claude.com/resources/articles?products=claude-code
  linkPattern: ^/resources/articles/[^/]+$

